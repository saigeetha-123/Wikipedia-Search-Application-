<!DOCTYPE html>
<html>

<head>
  <title>Wikipedia Search App</title>
  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    crossorigin="anonymous" />
  <script src="https://kit.fontawesome.com/5f59ca6ad3.js" crossorigin="anonymous"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap");

    .main-container {
      font-family: "Roboto";
    }

    .wiki-search-header {
      border: 1px solid #d5cdcd;
      padding: 30px 20px;
      margin-bottom: 40px;
      text-align: center;
    }

    .wiki-logo {
      margin-bottom: 30px;
      width: 150px;
    }

    .search-input {
      border-radius: 3px;
      padding: 10px;
      border: 1px solid #d5cdcd;
      font-size: 18px;
    }

    .search-results {
      width: 100%;
      padding-left: 20px;
    }

    .result-item {
      margin-bottom: 20px;
    }

    .result-title {
      font-size: 22px;
    }

    .link-description {
      font-size: 15px;
      color: #444444;
    }

    .result-url {
      color: #006621;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="main-container">
    <div class="wiki-search-header">
      <img class="wiki-logo"
        src="https://nkb-backend-otg-media-static.s3.ap-south-1.amazonaws.com/ccbp-dynamic-webapps/wiki-logo-img.png" />
      <br />
      <input placeholder="Type a keyword and press Enter to search" type="search" class="search-input w-100"
        id="searchInput" />
    </div>

    <div class="d-none" id="spinner">
      <div class="d-flex justify-content-center">
        <div class="spinner-border" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>
    </div>

    <div class="search-results" id="searchResults"></div>
  </div>

  <script>
    let searchInputEl = document.getElementById("searchInput");
    let searchResultsEl = document.getElementById("searchResults");
    let spinnerEl = document.getElementById("spinner");

    function createAndAppendSearchResult(result) {
      let resultItemEl = document.createElement("div");
      resultItemEl.classList.add("result-item");
      searchResultsEl.appendChild(resultItemEl);

      let { link, title, description } = result;

      let titleEl = document.createElement("a");
      titleEl.href = link;
      titleEl.target = "_blank";
      titleEl.textContent = title;
      titleEl.classList.add("result-title");
      resultItemEl.appendChild(titleEl);

      resultItemEl.appendChild(document.createElement("br"));

      let urlEl = document.createElement("a");
      urlEl.href = link;
      urlEl.target = "_blank";
      urlEl.textContent = link;
      urlEl.classList.add("result-url");
      resultItemEl.appendChild(urlEl);

      resultItemEl.appendChild(document.createElement("br"));

      let descriptionEl = document.createElement("p");
      descriptionEl.classList.add("link-description");
      descriptionEl.textContent = description;
      resultItemEl.appendChild(descriptionEl);
    }

    function displayResults(searchResults) {
      spinnerEl.classList.add("d-none");
      searchResultsEl.textContent = ""; // Clear previous results
      for (let result of searchResults) {
        createAndAppendSearchResult(result);
      }
    }

    function wikipediaSearch(event) {
      if (event.key === "Enter") {
        spinnerEl.classList.remove("d-none");
        searchResultsEl.textContent = "";
        let searchInput = searchInputEl.value;
        let url = "https://apis.ccbp.in/wiki-search?search=" + searchInput;

        fetch(url)
          .then(function (response) {
            return response.json();
          })
          .then(function (jsonData) {
            let { search_results } = jsonData;
            displayResults(search_results);
          });
      }
    }

    searchInputEl.addEventListener("keydown", wikipediaSearch);
  </script>
</body>

</html>
